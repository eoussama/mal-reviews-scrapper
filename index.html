<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    textarea {
      width: 100%;
      height: 300px;
    }

    summary {
      cursor: pointer;

      display: flex;
      flex-direction: row;

      color: grey;
    }

    summary:hover {
      background-color: whitesmoke;
    }

    h4 {
      margin: 0;
      color: black;
    }

    summary>* {
      margin-right: 10px;
    }

    button {
      border-radius: 5px;
      border: 1px solid black;
    }

    button:not(:last-of-type) {
      margin-right: 8px;
    }

    .active {
      outline-offset: 2px;
      outline: 2px solid black;
    }

    .old {
      color: #c2c2c2;
    }

    .changed {
      color: #ffbe0a;
    }

    .new {
      color: #1ba031;
    }

    .updated {
      color: #00a2ff;
    }

    .missing {
      color: #ff392b;
    }

    .versions {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .versions h5 {
      margin: 4px 0;
    }

    .cached-version {
      display: none;
    }

    .show-cached .versions {
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    }

    .show-cached .cached-version {
      display: block;
    }
  </style>

  <title>MAL Reviews Scrapper</title>
</head>

<body>
  <h1>MAL Reviews Scrapper</h1>
  <hr>

  <p>Created for my personal archiving needs.</p>
  <p id="cache"></p>
  <p id="stats"></p>
  <p>
    <label>
      <input type="checkbox" id="show-cached">
      Show cached versions of updated and changed reviews
    </label>
  </p>

  <hr>
  <ol id="reviews">Loading...</ol>

  <script>
    const STATUSES = ['old', 'new', 'changed', 'updated', 'missing'];
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];

    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const cache = await fetchJSON('assets/cache.json');
        const reviews = mergeReviews(await fetchJSON('assets/reviews.json'), cache.reviews);

        updateStatsDOM(reviews);
        updateReviewsDOM(reviews);
        updateCacheDOM(cache.timestamp);
        setupCachedToggle();
      } catch (error) {
        console.error(error);
        document.getElementById('reviews').textContent = `Failed to load the reviews: ${error.message}`;
      }
    });

    async function fetchJSON(url) {
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`GET ${url} returned HTTP ${response.status}.`);
      }

      return response.json();
    }

    function reviewKey(review) {
      return `${review.type}:${review.id}`;
    }

    // Whitespace is ignored so formatting changes on MAL's end don't count as edits.
    function normalizeContent(content) {
      return (content ?? '').replace(/\s+/g, '');
    }

    function reviewTime(review) {
      if (review.datetime) {
        return new Date(review.datetime).getTime();
      }

      // Older cache entries only have MAL's display strings, e.g. "Sep 1, 2019" and "12:41 PM".
      const match = `${review.date} ${review.time}`.match(/^(\w{3}) (\d{1,2}), (\d{4}) (\d{1,2}):(\d{2}) (AM|PM)$/);

      if (!match) {
        return 0;
      }

      const [, month, day, year, hours, minutes, period] = match;
      return new Date(+year, MONTHS.indexOf(month), +day, (+hours % 12) + (period === 'PM' ? 12 : 0), +minutes).getTime();
    }

    function mergeReviews(reviews, cachedReviews) {
      const cachedByKey = new Map(cachedReviews.map(e => [reviewKey(e), e]));
      const currentKeys = new Set(reviews.map(reviewKey));

      for (const review of reviews) {
        const cachedReview = cachedByKey.get(reviewKey(review));

        if (!cachedReview) {
          review.status = 'new';
        } else if (review.date !== cachedReview.date) {
          review.status = 'updated';
          review.cached = cachedReview;
        } else if (normalizeContent(review.content) !== normalizeContent(cachedReview.content)) {
          review.status = 'changed';
          review.cached = cachedReview;
        } else {
          review.status = 'old';
        }
      }

      for (const cachedReview of cachedReviews) {
        if (!currentKeys.has(reviewKey(cachedReview))) {
          reviews.push({ ...cachedReview, status: 'missing' });
        }
      }

      return reviews.sort((a, b) => reviewTime(a) - reviewTime(b));
    }

    function updateReviewsDOM(reviews) {
      const reviewsElement = document.getElementById('reviews');
      reviewsElement.innerHTML = '';

      for (const review of reviews) {
        const reviewElement = document.createElement('li');
        const reviewDetails = document.createElement('details');
        const reviewSummary = document.createElement('summary');
        const reviewTextArea = createReadOnlyTextArea(review.content);
        const reviewTitle = document.createElement('h4');
        const reviewRating = document.createElement('span');
        const reviewDate = document.createElement('span');
        const reviewLink = document.createElement('a');
        const reviewId = document.createElement('span');
        const reviewStatus = document.createElement('span');
        const reviewType = document.createElement('span');

        reviewLink.textContent = review.title;
        reviewLink.setAttribute('href', review.url);

        reviewId.textContent = `[${review.id}]`;
        reviewType.textContent = `[${review.type}]`;
        reviewDate.textContent = `${review.date} ${review.time}`;
        reviewRating.textContent = `${review.rating}/10 [${review.recommendation}]`;

        reviewStatus.textContent = `[${review.status}]`;
        reviewStatus.classList.add(review.status);

        reviewElement.id = `review-${review.type}-${review.id}`;
        reviewElement.dataset.type = review.type;
        reviewElement.dataset.status = review.status;

        reviewTitle.append(reviewLink);
        reviewSummary.append(reviewStatus, reviewId, reviewType, reviewTitle, reviewRating, reviewDate);

        if (review.cached) {
          reviewDetails.append(reviewSummary, createVersionsElement(review, reviewTextArea));
        } else {
          reviewDetails.append(reviewSummary, reviewTextArea);
        }
        reviewElement.append(reviewDetails);
        reviewsElement.append(reviewElement);
      }
    }

    function createVersionsElement(review, reviewTextArea) {
      const versionsElement = document.createElement('div');
      versionsElement.classList.add('versions');

      versionsElement.append(
        createVersionElement(`Current (${review.date} ${review.time})`, reviewTextArea),
        createVersionElement(`Cached (${review.cached.date} ${review.cached.time})`, createReadOnlyTextArea(review.cached.content), 'cached-version')
      );

      return versionsElement;
    }

    function createVersionElement(label, textArea, className) {
      const versionElement = document.createElement('div');
      const versionLabel = document.createElement('h5');

      versionLabel.textContent = label;
      versionElement.append(versionLabel, textArea);

      if (className) {
        versionElement.classList.add(className);
      }

      return versionElement;
    }

    function createReadOnlyTextArea(content) {
      const textArea = document.createElement('textarea');

      textArea.value = content.trim();
      textArea.readOnly = true;

      return textArea;
    }

    function setupCachedToggle() {
      const toggle = document.getElementById('show-cached');
      const update = () => document.body.classList.toggle('show-cached', toggle.checked);

      toggle.addEventListener('change', update);
      update();
    }

    function updateStatsDOM(reviews) {
      const statsElement = document.getElementById('stats');
      const reviewsElement = document.getElementById('reviews');
      const buttons = [];

      for (const status of ['all', ...STATUSES]) {
        const count = status === 'all' ? reviews.length : reviews.filter(e => e.status === status).length;
        const button = document.createElement('button');

        button.textContent = `${status[0].toUpperCase()}${status.slice(1)} Reviews ${count}`;
        button.addEventListener('click', () => filter(status, button));

        buttons.push(button);
        statsElement.append(button);
      }

      filter('all', buttons[0]);

      function filter(status, activeButton) {
        for (const button of buttons) {
          button.classList.toggle('active', button === activeButton);
        }

        for (const review of reviewsElement.querySelectorAll('li')) {
          review.style.display = status === 'all' || review.dataset.status === status ? 'list-item' : 'none';
        }
      }
    }

    function updateCacheDOM(cacheTimestamp) {
      const cacheElement = document.getElementById('cache');
      cacheElement.textContent = `Last cache on ${cacheTimestamp}.`;
    }
  </script>
</body>

</html>
